# QA do consumidor (AUR-512): sem credencial do modelo. A revisao nao pode
# rodar e precisa falhar fechada, com diagnostico, nunca aprovar.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@da344afd7c8000f0022c50975d267a8f4e3a6577
    secrets:
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
