# QA do consumidor (AUR-512): o token do job so le. A publicacao falha e o
# diagnostico precisa dizer que faltou permissao, com exit de falha.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: Mpaape/AurumCode@9a80daf90012fdccb17af9b05001f69b6d02dd4f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        with:
          publication: comments
          check: 'true'
