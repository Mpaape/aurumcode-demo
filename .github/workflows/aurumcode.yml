# QA do consumidor (AUR-512): o endpoint do modelo nao responde (porta
# fechada no loopback do runner). A revisao e inconclusiva e o gate reprova.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@d1990e6c8a4b6c4fd3fea65df7c944a6b16b8f8a
    secrets:
      LLM_API_KEY: chave-de-qa-sem-valor
      LLM_BASE_URL: http://127.0.0.1:9/v1
