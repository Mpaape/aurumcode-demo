# QA do consumidor (AUR-512): sem credencial do modelo. A revisao nao pode
# rodar e precisa falhar fechada, com diagnostico, nunca aprovar.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@d569ccb2ca9b7a7c6aed9de1c3633a708f15fb6c
    secrets:
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
