# QA do consumidor (AUR-512): workflow reutilizavel pinado por SHA, modo
# comments com sugestao inline, e o changelog obrigatorio. run.sh troca
# AURUMCODE_SHA pelo SHA sob teste antes de commitar este arquivo.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@9a80daf90012fdccb17af9b05001f69b6d02dd4f
    with:
      model: ${{ vars.LLM_MODEL }}
      publication: comments
      inline_comments: true
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  changelog:
    uses: Mpaape/AurumCode/.github/workflows/changelog.yml@9a80daf90012fdccb17af9b05001f69b6d02dd4f
