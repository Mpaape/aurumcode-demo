# QA do consumidor (AUR-512): workflow reutilizavel pinado por SHA, modo
# review formal, e o changelog obrigatorio. run.sh troca
# AURUMCODE_SHA pelo SHA sob teste antes de commitar este arquivo.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@d569ccb2ca9b7a7c6aed9de1c3633a708f15fb6c
    with:
      model: ${{ vars.LLM_MODEL }}
      publication: review
      inline_comments: true
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  changelog:
    uses: Mpaape/AurumCode/.github/workflows/changelog.yml@d569ccb2ca9b7a7c6aed9de1c3633a708f15fb6c
