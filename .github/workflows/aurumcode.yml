# QA do consumidor (AUR-512): o endpoint do modelo nao responde (porta
# fechada no loopback do runner). A revisao e inconclusiva e o gate reprova.
name: AurumCode
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@da344afd7c8000f0022c50975d267a8f4e3a6577
    secrets:
      LLM_API_KEY: chave-de-qa-sem-valor
      LLM_BASE_URL: http://127.0.0.1:9/v1
